# Haas VF-2 as a LinuxCNC-style ini for the rs274 interpreter + envelope check. Machine coords:
# X -762..0, Y -406..0, Z -508..0 (Haas home at X+,Y+,Z+). Work offsets below are where G54/G55 sit.
[EMC]
MACHINE = VF-2 (envelope model)
[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 423
[AXIS_X]
MIN_LIMIT = -762
MAX_LIMIT = 0
[AXIS_Y]
MIN_LIMIT = -406
MAX_LIMIT = 0
[AXIS_Z]
MIN_LIMIT = -508
MAX_LIMIT = 0
[WORK]
G54 = -450, -250, -350
G55 = -450, -250, -380
[EMCIO]
TOOL_TABLE = tool.tbl
[RS274NGC]
PARAMETER_FILE = rs274ngc.var
